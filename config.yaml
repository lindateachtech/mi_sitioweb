    title: "Linda Cabrera"
    content: "Soy analista de datos con formación en técnicas cuantitativas para la gestión empresarial. Construyo dashboards y modelos analíticos, y enseño R y ciencia de datos como instructora certificada de The Carpentries. Co-organizo R-Ladies Guayaquil y desarrollo mi primer paquete de R con el acompañamiento de rOpenSci."
    image: /images/ljco1.png
