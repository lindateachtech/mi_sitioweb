{{ define "head" }}
<meta name="description" content="{{ .Title }} of {{ .Site.Title }}">
<link rel="stylesheet" href="{{ .Site.Params.staticPath }}/css/cursos.css" media="all">
{{ end }}

{{ define "title" }}
{{.Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<div class="container pt-5 pb-5" id="courses">
    <h2 class="text-center pb-2">{{.Title}}</h2>
    <div class="row justify-content-center">
        {{ range .Pages }}
        <div class="col-lg-4 col-md-6 my-3">
            <div class="card my-3 h-100" title="{{ .Title }}">
                <div class="card-head">
                    <img class="card-img-top" src="{{ .Params.image }}" alt="{{ .Title }}">
                </div>
                <div class="card-body bg-transparent p-3">
                    <div class="pb-2 bg-transparent">
                        {{ range .Params.tags }}
                        <span class="badge badge-secondary">{{ . }}</span>
                        {{ end }}
                    </div>
                    <h5 class="card-title bg-transparent">{{ .Title | truncate 50 }}</h5>
                    <div class="card-text bg-transparent secondary-font">
                        {{ .Summary | truncate 100 | safeHTML }}
                    </div>
                </div>
                <div class="card-footer py-3">
                    <span class="float-end">
                        <a class="btn read-more-btn btn-sm" href="{{ .RelPermalink }}">
                            Ver curso
                        </a>
                    </span>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
